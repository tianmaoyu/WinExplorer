name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # macos-14 镜像已于 2026-11-02 被 GitHub 退役：任务在派发阶段就被拒，
    # runner 从不分配，运行会在 1s 内以 cancelled 结束，注解是
    # "The configuration 'macos-14-arm64-us-default' is not supported"。
    # 换成 macos-15（Apple Silicon），别改回去。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build app bundle
        run: ./scripts/build_app.sh

      # The self-test suite drives AppKit, so it needs a window server.
      # GitHub's macOS runners usually have one, but we don't want a flaky
      # GUI environment to block a perfectly good build.
      - name: Self-tests
        continue-on-error: true
        run: |
          WINEXPLORER_SELFTEST=1 WINEXPLORER_LANG=en \
            build/WinExplorer.app/Contents/MacOS/WinExplorer | tail -20
